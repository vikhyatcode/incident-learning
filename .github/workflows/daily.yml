name: Collect and publish

on:
  schedule:
    - cron: "37 8 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "web/**"
      - "tests/**"
      - "data/case-studies.json"
      - ".github/workflows/daily.yml"

permissions: {}

concurrency:
  group: incident-learning-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      models: read
    steps:
      - name: Check out latest archive
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: true
      - name: Run focused tests
        run: |
          python3 -m unittest discover -s tests -v
          node --test tests/filters.test.mjs
      - name: Verify built-in model access
        env:
          GH_MODELS_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          payload = {"model": "openai/gpt-4.1-mini", "messages": [
              {"role": "user", "content": "Reply with the single word available."}],
              "max_tokens": 8, "temperature": 0}
          request = urllib.request.Request(
              "https://models.github.ai/inference/chat/completions",
              data=json.dumps(payload).encode(),
              headers={"Authorization": "Bearer " + os.environ["GH_MODELS_TOKEN"],
                       "Content-Type": "application/json"})
          try:
              with urllib.request.urlopen(request, timeout=40) as response:
                  result = json.load(response)
                  print("Model access HTTP", response.status,
                        "reply:", result["choices"][0]["message"]["content"])
          except urllib.error.HTTPError as error:
              print("Model access unavailable HTTP", error.code,
                    error.read(800).decode(errors="replace"))
          PY
      - name: Collect current public feeds
        run: python3 scripts/pipeline.py collect
      - name: Build static learning library
        run: python3 scripts/pipeline.py build
      - name: Preserve incident history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/incidents.json data/collection.json
          if ! git diff --cached --quiet; then
            git commit -m "Update selected incident archive" \
              -m "Co-authored-by: Copilot App <223556219+Copilot@users.noreply.github.com>"
            git push origin HEAD:main
          fi
      - name: Upload this run's site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
